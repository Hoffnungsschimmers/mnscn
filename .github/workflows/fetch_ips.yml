name: Fetch Subscription IPs

on:
  schedule:
    # 每 12 小时运行一次（UTC 02:00 和 14:00，即北京时间 10:00 和 22:00）
    - cron: '0 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch IPs from subscriptions
        run: python scripts/fetch_ips.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addressesapi_fetched.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: update fetched IPs $(date -u +%Y-%m-%d)"
            git push
          fi
